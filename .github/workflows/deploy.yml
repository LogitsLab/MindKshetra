name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mindkshetra-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        # Pinned: 58.4.4 fails prebuilt deploys with
        # "ENOENT: lstat node_modules/styled-jsx/index.js" during file upload;
        # 58.4.0 is the last version verified good here. Bump deliberately.
        run: npm install -g vercel@58.4.0

      - name: Pull Vercel project config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Sensitive-flagged vars pull as the literal "[SENSITIVE]", which then
      # crashes next build (metadataBase / Supabase URL → Invalid URL).
      # NEXT_PUBLIC_* and CONTENT_SOURCE must stay non-sensitive so prebuilt
      # CI can read them. SERVICE_ROLE may stay sensitive (runtime-only).
      - name: Guard against redacted build-time env
        run: |
          file=.vercel/.env.production.local
          bad=$(grep -E '^(NEXT_PUBLIC_|CONTENT_SOURCE)=.*\[SENSITIVE\]' "$file" || true)
          if [ -n "$bad" ]; then
            echo "::error::vercel pull redacted build-time env as [SENSITIVE]. Re-add those vars with --no-sensitive (see docs/dev-environment.md)."
            echo "$bad" | sed 's/=.*/=…/'
            exit 1
          fi

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to production
        # --archive=tgz uploads one tarball instead of thousands of files.
        # Without it the free tier's daily upload quota (api-upload-free,
        # >5000 files/day) kills the deploy — it killed three dev deploys
        # before the same fix landed in deploy-dev.yml. Assignment form so a
        # failure fails THIS step loudly instead of passing an empty URL on.
        run: |
          url=$(vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          test -n "$url"
          echo "Deployed: $url"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
