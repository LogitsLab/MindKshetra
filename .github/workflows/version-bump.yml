name: Auto version bump

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bump:
    if: >-
      !contains(github.event.head_commit.message, 'chore: bump version') &&
      github.event.before != '0000000000000000000000000000000000000000' &&
      secrets.VERSION_BUMP_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.VERSION_BUMP_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump patch if PR did not change version
        id: bump
        env:
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set +e
          node scripts/bump-version-if-needed.mjs
          code=$?
          set -e
          if [ "$code" -eq 42 ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Commit and push version bump
        if: steps.bump.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to v${VERSION}"
          git push origin HEAD:main
