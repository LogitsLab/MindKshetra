name: Auto version bump

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: >-
      !contains(github.event.head_commit.message, 'chore: bump version') &&
      github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump patch if PR did not change version
        id: bump
        env:
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set +e
          node scripts/bump-version-if-needed.mjs
          code=$?
          set -e
          if [ "$code" -eq 42 ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Open and merge version bump PR
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          BRANCH="chore/auto-version-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore: bump version to v${VERSION}"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: bump version to v${VERSION}" \
            --body "Automated patch bump — no version change in the merged PR."
          gh pr merge --merge --admin --delete-branch
