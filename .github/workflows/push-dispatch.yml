name: Push dispatch

# Half-hourly tick for /api/cron/notify-dispatch (per-user local-hour windows
# need finer granularity than Vercel cron offers on this plan; a few minutes
# of GitHub cron jitter is fine for a morning verse).
#
# notify-dispatch is the v2 dispatcher (notification_log claim-then-send,
# receipts, sweeper); it supersedes /api/cron/push-dispatch, which stays
# routable but unscheduled. Requires the CRON_SECRET repository secret to
# match the Vercel env var of the same name. The route 500s with a clear
# message until migration 020 is applied — that run is a no-op, not a loop.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: push-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call dispatcher
        run: |
          curl -fsS --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.PUSH_DISPATCH_URL || 'https://mind.logitslab.com/api/cron/notify-dispatch' }}"
