name: Deploy dev to Vercel

# The dev integration branch deploys to https://mind-dev.logitslab.com as a
# Vercel *preview* deployment aliased to a stable domain. Production stays
# main-only (deploy.yml). Setup steps live in docs/dev-environment.md.

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: mindkshetra-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        # Pinned to match deploy.yml — 58.4.4 fails prebuilt deploys with
        # "ENOENT: lstat node_modules/styled-jsx/index.js". Bump deliberately.
        run: npm install -g vercel@58.4.0

      - name: Pull Vercel project config (preview, dev branch env)
        run: vercel pull --yes --environment=preview --git-branch=dev --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Sensitive-flagged vars pull as the literal "[SENSITIVE]", which then
      # crashes next build (metadataBase / Supabase URL → Invalid URL).
      # NEXT_PUBLIC_* and CONTENT_SOURCE must stay non-sensitive so prebuilt
      # CI can read them. SERVICE_ROLE may stay sensitive (runtime-only).
      - name: Guard against redacted build-time env
        run: |
          file=.vercel/.env.preview.local
          bad=$(grep -E '^(NEXT_PUBLIC_|CONTENT_SOURCE)=.*\[SENSITIVE\]' "$file" || true)
          if [ -n "$bad" ]; then
            echo "::error::vercel pull redacted build-time env as [SENSITIVE]. Re-add those vars with --no-sensitive (see docs/dev-environment.md)."
            echo "$bad" | sed 's/=.*/=…/'
            exit 1
          fi

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy (preview)
        id: deploy
        # Assignment form so a deploy failure fails THIS step loudly instead
        # of feeding an empty URL to the alias step. --archive=tgz uploads
        # one tarball instead of thousands of files — the free tier's daily
        # upload quota (code "api-upload-free", >5000 files/day) killed
        # three deploys before this; the prebuilt output alone exceeds it.
        run: |
          url=$(vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Alias to mind-dev.logitslab.com
        # Owner-gated: until the domain is added to the Vercel project +
        # DNS, aliasing fails ("Response Error") while the deploy above
        # succeeded. A missing vanity domain must not paint the run red —
        # the deploy step's own URL is the artifact that matters.
        continue-on-error: true
        run: vercel alias set ${{ steps.deploy.outputs.url }} mind-dev.logitslab.com --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
