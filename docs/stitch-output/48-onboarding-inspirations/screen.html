<script>
        // Simple micro-interaction for tile selection
        const tiles = document.querySelectorAll('.group');
        tiles.forEach(tile => {
            tile.addEventListener('click', () => {
                // Remove selected state from others
                tiles.forEach(t => {
                    t.classList.remove('brass-border');
                    t.classList.add('border-white/10');
                    const check = t.querySelector('.bg-primary');
                    if(check) check.remove();
                });

                // Add selected state to current
                tile.classList.remove('border-white/10');
                tile.classList.add('brass-border');
                
                const checkDiv = document.createElement('div');
                checkDiv.className = 'absolute top-2 right-2 w-6 h-6 rounded-full bg-primary flex items-center justify-center fade-in';
                checkDiv.innerHTML = '<span class="material-symbols-outlined text-[16px] text-on-primary font-bold">check</span>';
                tile.appendChild(checkDiv);
            });
        });
    </script>
