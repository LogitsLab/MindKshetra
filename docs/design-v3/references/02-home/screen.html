<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>App Home v3 — full lifestyle</title>
  <style>
    body { margin:0; background:#07090f; color:#eef2f7; font-family:Sora,sans-serif; max-width:390px; margin-inline:auto; border:1px solid rgba(255,255,255,.06); min-height:100vh; }
    header { display:flex; justify-content:space-between; padding:1rem; }
    .brand { font-family:Fraunces,serif; color:#c9a227; }
    .streak { font-size:12px; color:#c9a227; border:1px solid rgba(201,162,39,.22); padding:.2rem .5rem; }
    section { padding:1rem; border-top:1px solid rgba(255,255,255,.06); }
    .tile { border:1px solid rgba(201,162,39,.22); padding:.75rem; margin:.4rem 0; background:#0e1420; }
    .tabs { position:sticky; bottom:0; display:grid; grid-template-columns:repeat(4,1fr); background:rgba(7,9,15,.9); border-top:1px solid rgba(255,255,255,.06); }
    .tabs span { text-align:center; padding:.75rem 0; font-size:11px; color:#9aa8bc; }
    .tabs .on { color:#c9a227; }
    .fab { position:fixed; right:calc(50% - 195px + 16px); bottom:64px; width:52px; height:52px; border-radius:50%; background:#c9a227; color:#07090f; display:grid; place-items:center; font-size:12px; }
  </style>
</head>
<body>
  <header><span class="brand">MindKshetra</span><span class="streak">7</span></header>
  <section><h1 class="brand" style="font-size:1.75rem">MindKshetra</h1><p>Madhav · Explore CTAs</p></section>
  <section><div class="tile">VOTD</div></section>
  <section><div class="tile">Sādhana</div><div class="tile">Meditation continue</div></section>
  <section><div class="tile">Japa</div><div class="tile">Panchang</div><div class="tile">Paths</div><div class="tile">Community</div></section>
  <section><div class="tile">6 path tiles</div><div class="tile">Mood chips</div><div class="tile">Madhav close band</div></section>
  <div class="fab">M</div>
  <div class="tabs"><span class="on">Home</span><span>Explore</span><span>Mood</span><span>Astrology</span></div>
</body>
</html>
