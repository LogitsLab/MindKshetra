<style>

<!-- Interactive Layer for subtle dust/sparkle effect -->
<div class="fixed inset-0 pointer-events-none z-1 overflow-hidden" id="particles"></div>
<script>
        // Simple ambient particle effect for "Sacred Space" feel
        const particleContainer = document.getElementById('particles');
        const particleCount = 15;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.style.position = 'absolute';
            particle.style.width = '1px';
            particle.style.height = '1px';
            particle.style.backgroundColor = '#c9a227';
            particle.style.borderRadius = '50%';
            particle.style.opacity = Math.random() * 0.4;
            
            // Random position
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.top = Math.random() * 100 + 'vh';
            
            particleContainer.appendChild(particle);
            
            // Subtle float animation
            animateParticle(particle);
        }

        function animateParticle(p) {
            const duration = 10000 + Math.random() * 20000;
            const keyframes = [
                { transform: 'translate(0, 0)', opacity: p.style.opacity },
                { transform: `translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px)`, opacity: 0.1 },
                { transform: 'translate(0, 0)', opacity: p.style.opacity }
            ];
            
            p.animate(keyframes, {
                duration: duration,
                iterations: Infinity,
                easing: 'ease-in-out'
            });
        }
        
        // Chip Interaction Logic
        const chips = document.querySelectorAll('.grid button');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => {
                    c.classList.remove('brass-border-selected', 'text-primary', 'shadow-[0_0_15px_rgba(201,162,39,0.15)]');
                    c.classList.add('brass-border', 'text-on-surface-variant');
                });
                chip.classList.add('brass-border-selected', 'text-primary', 'shadow-[0_0_15px_rgba(201,162,39,0.15)]');
                chip.classList.remove('brass-border', 'text-on-surface-variant');
            });
        });
    </script>
