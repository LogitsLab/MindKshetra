</div>

<!-- Micro-Interactions Script -->
<script>
        const breathInstruction = document.getElementById('breath-instruction');
        const breathTimer = document.getElementById('breath-timer');
        const playPauseBtn = document.getElementById('play-pause');
        const playPauseIcon = playPauseBtn.querySelector('.material-symbols-outlined');
        
        let cycle = 0;
        const phases = [
            { label: 'Inhale', duration: 4 },
            { label: 'Hold', duration: 4 },
            { label: 'Exhale', duration: 4 },
            { label: 'Wait', duration: 4 }
        ];

        function updateBreathCycle() {
            const currentPhase = phases[cycle % phases.length];
            breathInstruction.style.opacity = '0';
            
            setTimeout(() => {
                breathInstruction.innerText = currentPhase.label;
                breathTimer.innerText = `${currentPhase.duration}s`;
                breathInstruction.style.opacity = '1';
                cycle++;
            }, 500);
        }

        // Initialize breath cycle
        setInterval(updateBreathCycle, 4000);

        // Simple Toggle for Play/Pause
        let isPlaying = true;
        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playPauseIcon.innerText = isPlaying ? 'pause' : 'play_arrow';
            
            const ring = document.getElementById('breath-ring');
            if (isPlaying) {
                ring.classList.add('breath-ring-animate');
                ring.style.animationPlayState = 'running';
            } else {
                ring.style.animationPlayState = 'paused';
            }
        });

        // Interactive "Void" cursor glow
        document.body.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            const glow = document.querySelector('.aura-halo');
            glow.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(61, 122, 106, 0.1) 0%, rgba(7, 9, 15, 0) 50%)`;
        });
    </script>
