<style>

<script>
        // Micro-interaction: Smooth selection toggle for demonstration
        document.querySelectorAll('button.glass-card').forEach(tile => {
            tile.addEventListener('click', function() {
                // If it's one of the already selected ones, we just simulate the UI
                const check = this.querySelector('.check-mark');
                const label = this.querySelector('span:last-child');
                
                if (this.classList.contains('selected-tile')) {
                    this.classList.remove('selected-tile');
                    if(check) check.classList.add('hidden');
                    label.classList.replace('text-on-surface', 'text-on-surface-variant');
                } else {
                    this.classList.add('selected-tile');
                    if(check) {
                        check.classList.remove('hidden');
                    } else {
                        const newCheck = document.createElement('span');
                        newCheck.className = 'absolute top-2 right-2 material-symbols-outlined text-brass text-[16px] check-mark';
                        newCheck.textContent = 'check_circle';
                        this.appendChild(newCheck);
                    }
                    label.classList.replace('text-on-surface-variant', 'text-on-surface');
                }
            });
        });
    </script>
