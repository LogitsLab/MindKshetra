<html class="dark" lang="en"><head>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&amp;family=Sora:wght@300;400;500;600;700&amp;family=Noto+Serif:ital,wght@0,400;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Sora:wght@300;400;500;600;700&display=swap');

        :root {
            --brass: #c9a227;
            --void: #07090f;
            --field: #0e1420;
        }

        body {
            background-color: var(--void);
            color: #e1e2eb;
            overflow-x: hidden;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        .glass-panel {
            background: rgba(14, 20, 32, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        .gold-pulse:active {
            animation: pulse-gold 1.5s infinite;
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(201, 162, 39, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(201, 162, 39, 0); }
            100% { box-shadow: 0 0 0 0 rgba(201, 162, 39, 0); }
        }

        .soft-rise {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .soft-rise:hover {
            transform: translateY(-2px);
        }

        .scrim-overlay {
            background: linear-gradient(to bottom, rgba(7, 9, 15, 0.4) 0%, rgba(7, 9, 15, 0.85) 60%, rgba(7, 9, 15, 1) 100%);
        }

        .brass-border {
            border: 1px solid rgba(201, 162, 39, 0.3);
        }

        .text-glow {
            text-shadow: 0 0 20px rgba(236, 194, 70, 0.3);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#11131a",
                        "primary": "#ecc246",
                        "on-surface": "#e1e2eb",
                        "on-surface-variant": "#d1c5af",
                        "primary-container": "#c9a227",

                        "surface-container": "#1d1f26",

                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "gutter": "16px",
                        "container-margin": "24px",
                        "unit": "8px",
                        "section-gap": "64px"
                    },
                    fontFamily: {
                        "headline-lg": ["Libre Caslon Text"],
                        "headline-lg-mobile": ["Libre Caslon Text"],
                        "body-lg": ["Sora"],
                        "title-md": ["Sora"],
                        "label-sm": ["Sora"],
                        "body-md": ["Sora"]
                    },
                    fontSize: {
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "400"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "400"}],
                        "title-md": ["18px", {"lineHeight": "24px", "letterSpacing": "0.05em", "fontWeight": "600"}],

                        "body-md": ["14px", {"lineHeight": "24px", "fontWeight": "300"}],
                        "body-lg": ["16px", {"lineHeight": "28px", "fontWeight": "300"}]

<body class="bg-background selection:bg-primary/30 selection:text-primary">
<!-- Top Navigation Shell (De-emphasized) -->

</div>
<!-- Central Content Cluster -->
<section class="relative z-20 max-w-2xl px-container-margin text-center flex flex-col items-center gap-unit animate-fade-in">
<!-- Hero Icon & Wordmark -->
<div class="mb-6 flex flex-col items-center">
<div class="w-16 h-16 mb-4 text-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[64px] text-glow" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<h1 class="font-headline-lg text-headline-lg md:text-display-lg md:font-display-lg text-on-surface tracking-widest uppercase">

<!-- Primary CTA -->

        </p>

<script>
        // Simple entry animation
        document.addEventListener('DOMContentLoaded', () => {
            const section = document.querySelector('section');
            section.style.opacity = '0';
            section.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                section.style.transition = 'all 1.2s cubic-bezier(0.22, 1, 0.36, 1)';
                section.style.opacity = '1';
                section.style.transform = 'translateY(0)';
            }, 300);
        });

        // Hover tracking for "Aura" effect
        document.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.bg-tertiary\\/10');
            if (glow) {
                const moveX = (e.clientX - window.innerWidth / 2) / 20;
                const moveY = (e.clientY - window.innerHeight / 2) / 20;
                glow.style.transform = `translate(calc(-50% + ${moveX}px), ${moveY}px)`;
            }
        });
    </script>
</body></html>
