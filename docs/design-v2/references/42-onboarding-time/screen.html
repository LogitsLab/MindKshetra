<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MindKshetra Onboarding - Dedication</title>

          extend: {

                    "tertiary-fixed": "#b0efdc",
                    "on-error": "#690005",
                    "surface-container": "#1d1f26",
                    "surface-container-lowest": "#0c0e14",
                    "on-tertiary": "#00382d",
                    "outline-variant": "#4d4635",
                    "primary": "#ecc246",
                    "on-primary-fixed-variant": "#584400",
                    "on-primary-fixed": "#241a00",
                    "primary-fixed": "#ffe08e",
                    "outline": "#99907b",
                    "surface-variant": "#33353c",
                    "surface-container-highest": "#33353c",
                    "surface": "#11131a",
                    "inverse-primary": "#755b00",
                    "surface-bright": "#373940",
                    "secondary": "#e2c45a",
                    "on-background": "#e1e2eb",
                    "surface-dim": "#11131a",
                    "on-tertiary-fixed": "#002019",
                    "surface-container-low": "#191b22",
                    "error-container": "#93000a",
                    "on-primary-container": "#4b3a00",
                    "on-primary": "#3d2e00",
                    "primary-fixed-dim": "#ecc246",
                    "on-tertiary-container": "#004538",
                    "on-error-container": "#ffdad6",
                    "secondary-fixed": "#ffe179",
                    "surface-container-high": "#282a31",
                    "on-tertiary-fixed-variant": "#095042"
            },
            "borderRadius": {

                    "section-gap": "64px",

            "fontFamily": {

          },
        },
      }

<style>
        body {
            background-color: #07090f;
            color: #e1e2eb;
            overflow-x: hidden;
        }
        .aura-glow {
            background: radial-gradient(circle at 50% 50%, rgba(61, 122, 106, 0.08) 0%, transparent 70%);
        }
        .brass-border {
            border: 1px solid rgba(201, 162, 39, 0.22);
        }
        .selected-item {
            border-color: #c9a227;
            background: rgba(201, 162, 39, 0.05);
        }
        .glass-panel {
            backdrop-filter: blur(20px);
            background: rgba(14, 20, 32, 0.6);
        }
        .soft-rise {
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .soft-rise:hover {
            transform: translateY(-2px);
            border-color: rgba(201, 162, 39, 0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen font-body-md">
<!-- Atmospheric Background Animation -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">

<div class="aura-glow absolute inset-0"></div>
</div>
<!-- Top Navigation & Progress -->
<header class="relative z-10 px-container-margin pt-12 pb-6 flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-start text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined text-2xl" data-icon="chevron_left">chevron_left</span>
</button>
<div class="flex gap-2">
<div class="w-1.5 h-1.5 rounded-full bg-primary/30"></div>
<div class="w-1.5 h-1.5 rounded-full bg-primary/30"></div>
<div class="w-1.5 h-1.5 rounded-full bg-primary/30"></div>
<div class="w-1.5 h-1.5 rounded-full bg-primary shadow-[0_0_8px_rgba(236,194,70,0.6)]"></div>
<div class="w-1.5 h-1.5 rounded-full bg-primary/20"></div>
</div>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<!-- Content Canvas -->
<main class="relative z-10 flex-1 px-container-margin pt-4 pb-32 max-w-lg mx-auto w-full">
<!-- Header Section -->
<section class="mb-12 text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-4 leading-tight tracking-tight">
                How much time can you dedicate?
            </h1>
<p class="font-body-lg text-on-surface-variant/80">
                We’ll shape a daily rhythm you can keep.
            </p>
</section>
<!-- Time Selection List -->
<div class="space-y-4">
<!-- Item 5 min -->
<button class="w-full flex items-center justify-between px-6 py-5 rounded-lg brass-border glass-panel soft-rise group">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary/70 group-hover:text-primary transition-colors" data-icon="schedule">schedule</span>
<span class="font-title-md text-on-surface">5 min</span>
</div>
<div class="w-5 h-5 rounded-full border border-primary/20"></div>
</button>
<!-- Item 10 min (SELECTED) -->
<button class="w-full flex items-center justify-between px-6 py-5 rounded-lg selected-item glass-panel soft-rise group">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" data-icon="schedule" style="font-variation-settings: 'FILL' 1;">schedule</span>
<span class="font-title-md text-on-surface">10 min</span>
</div>
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-background text-sm font-bold" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Item 20 min -->
<button class="w-full flex items-center justify-between px-6 py-5 rounded-lg brass-border glass-panel soft-rise group">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary/70 group-hover:text-primary transition-colors" data-icon="schedule">schedule</span>
<span class="font-title-md text-on-surface">20 min</span>
</div>
<div class="w-5 h-5 rounded-full border border-primary/20"></div>
</button>
<!-- Item 30 min -->
<button class="w-full flex items-center justify-between px-6 py-5 rounded-lg brass-border glass-panel soft-rise group">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary/70 group-hover:text-primary transition-colors" data-icon="schedule">schedule</span>
<span class="font-title-md text-on-surface">30 min</span>
</div>
<div class="w-5 h-5 rounded-full border border-primary/20"></div>
</button>
<!-- Item 1 hour+ -->
<button class="w-full flex items-center justify-between px-6 py-5 rounded-lg brass-border glass-panel soft-rise group">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary/70 group-hover:text-primary transition-colors" data-icon="schedule">schedule</span>
<span class="font-title-md text-on-surface">1 hour+</span>
</div>
<div class="w-5 h-5 rounded-full border border-primary/20"></div>
</button>
</div>
<!-- Atmospheric Secondary Text (Sanskrit Context) -->
<div class="mt-12 text-center opacity-30 select-none">
<p class="font-sanskrit-text text-on-surface-variant italic text-sm tracking-widest">
                अभ्यासवैराग्याभ्यां तन्निरोधः
            </p>
</div>
</main>
<!-- Sticky Bottom Navigation -->
<footer class="fixed bottom-0 left-0 w-full z-20 px-container-margin pb-12 pt-8 bg-gradient-to-t from-background via-background to-transparent">
<div class="max-w-lg mx-auto flex flex-col items-center gap-6">
<button class="w-full py-5 bg-primary-container text-on-primary-container font-label-sm uppercase tracking-[0.2em] rounded-full shadow-[0_4px_24px_rgba(201,162,39,0.3)] active:scale-95 transition-transform duration-200">
                Next
            </button>
<a class="font-label-sm text-on-surface-variant/60 hover:text-primary transition-colors duration-300" href="#">
                Skip
            </a>
</div>
</footer>
<!-- Decorative Bottom Gradient for Depth -->
<div class="fixed bottom-0 left-0 w-full h-32 bg-gradient-to-t from-black to-transparent pointer-events-none opacity-40 z-10"></div>
<script>
        // Micro-interaction for list item selection
        document.querySelectorAll('button.glass-panel').forEach(button => {
            button.addEventListener('click', function() {
                // Reset all
                document.querySelectorAll('button.glass-panel').forEach(btn => {
                    btn.classList.remove('selected-item');
                    btn.classList.add('brass-border');
                    const icon = btn.querySelector('.material-symbols-outlined');
                    if(icon) icon.style.fontVariationSettings = "'FILL' 0";
                    const indicator = btn.querySelector('.w-6, .w-5');
                    if(indicator) {
                        indicator.className = 'w-5 h-5 rounded-full border border-primary/20';
                        indicator.innerHTML = '';
                    }
                });

                // Set Active
                this.classList.remove('brass-border');
                this.classList.add('selected-item');
                const activeIcon = this.querySelector('.material-symbols-outlined');
                if(activeIcon) activeIcon.style.fontVariationSettings = "'FILL' 1";
                const activeIndicator = this.querySelector('.w-5');
                if(activeIndicator) {
                    activeIndicator.className = 'w-6 h-6 rounded-full bg-primary flex items-center justify-center';
                    activeIndicator.innerHTML = '<span class="material-symbols-outlined text-background text-sm font-bold" data-icon="check" style="font-variation-settings: \'FILL\' 1;">check</span>';
                }
            });
        });
    </script>
</body></html>
